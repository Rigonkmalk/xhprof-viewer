/* ================================================================== *
 * 10. Self-tests — open this file with ?selftest=1
 *
 * The parsers and the model are the parts that actually break, and they are
 * pure functions, so they can be asserted without a browser harness.
 * ================================================================== */

var SELF_TESTS = [
["unserialize: scalars", function(t){
  t.eq(phpUnserialize("i:42;"), 42);
  t.eq(phpUnserialize("i:-7;"), -7);
  t.eq(phpUnserialize("d:1.5;"), 1.5);
  t.eq(phpUnserialize("b:1;"), true);
  t.eq(phpUnserialize("b:0;"), false);
  t.eq(phpUnserialize("N;"), null);
  t.ok(isNaN(phpUnserialize("d:NAN;")));
  t.eq(phpUnserialize("d:INF;"), Infinity);
  t.eq(phpUnserialize("d:-INF;"), -Infinity);
}],

["unserialize: string lengths are byte counts", function(t){
  t.eq(phpUnserialize('s:5:"hello";'), "hello");
  t.eq(phpUnserialize('s:3:"é1";'), "é1");   /* é is 2 bytes + "1" */
  t.eq(phpUnserialize('s:4:"😀";'), "😀"); /* 4 bytes, 2 code units */
  t.eq(phpUnserialize('a:1:{s:2:"é";i:1;}')["é"], 1);
  /* byteChars mode: the payload was decoded latin-1, one char == one byte */
  t.eq(phpUnserialize('s:2:"Ã©";', true), "Ã©");
}],

["unserialize: arrays and objects", function(t){
  var a = phpUnserialize('a:2:{s:1:"a";i:1;s:1:"b";a:1:{i:0;i:9;}}');
  t.eq(a.a, 1);
  t.eq(a.b[0], 9);
  var o = phpUnserialize('O:3:"Foo":2:{s:6:"\x00Foo\x00p";i:1;s:1:"q";i:2;}');
  t.eq(o.p, 1);   /* private property mangling stripped */
  t.eq(o.q, 2);
}],

["unserialize: a __proto__ key stays a key", function(t){
  var a = phpUnserialize('a:2:{s:9:"__proto__";i:7;s:11:"constructor";i:8;}');
  t.eq(a.__proto__, 7);
  t.eq(a.constructor, 8);
  t.eq(Object.keys(a).length, 2);
}],

["unserialize: unsupported types fail clearly", function(t){
  t.eq(phpUnserialize('E:8:"Suit:Hea";'), "Suit:Hea");
  t.throws(function(){ phpUnserialize("R:1;"); }, /back-references/);
  t.throws(function(){ phpUnserialize("r:1;"); }, /back-references/);
  t.throws(function(){ phpUnserialize('C:3:"Foo":3:{abc}'); }, /custom-serialized/);
  t.throws(function(){ phpUnserialize("x:1;"); }, /unknown type/);
  t.throws(function(){ phpUnserialize('s:5:"ab";'); }, /offset/);
}],

["php array literal parser", function(t){
  var a = phpLiteralParse("<?php return array('a' => array('ct' => 1, 'wt' => 2,), 'b' => [3, 4],);");
  t.eq(a.a.ct, 1);
  t.eq(a.a.wt, 2);
  t.eq(a.b[0], 3);
  t.eq(a.b[1], 4);
  t.eq(phpLiteralParse("array('x' => 'a\\'b')").x, "a'b");
  t.eq(phpLiteralParse('["n" => -1.5e2]').n, -150);
  t.eq(phpLiteralParse("[true, false, null]")[0], true);
  t.eq(phpLiteralParse("[true, false, null]")[1], false);
  t.eq(phpLiteralParse("[true, false, null]")[2], null);
  t.eq(phpLiteralParse("['__proto__' => 5]").__proto__, 5);
  t.throws(function(){ phpLiteralParse("array('a' => "); }, /php literal/);
}],

["format sniffing", function(t){
  t.eq(parseProfileText('a:1:{s:6:"main()";a:1:{s:2:"wt";i:5;}}').format, "PHP serialize()");
  t.eq(parseProfileText('{"main()":{"wt":5}}').format, "JSON");
  t.eq(parseProfileText("<?php return array('main()' => array('wt' => 5));").format, "PHP array literal");
  t.eq(parseProfileText("﻿{\"main()\":{\"wt\":5}}").format, "JSON");
  t.throws(function(){ parseProfileText("   "); }, /Empty/);
  t.throws(function(){ parseProfileText("nonsense"); }, /Unrecognised/);
}],

["extractProfile: bare, wrapped, nested", function(t){
  var bare = { "main()": { wt: 1 } };
  t.eq(extractProfile(bare).profile, bare);
  var w = extractProfile({ profile: bare, meta: { url: "/x" } });
  t.eq(w.profile, bare);
  t.eq(w.meta.meta.url, "/x");                 /* everything else kept as metadata */
  var n = extractProfile({ runs: bare });
  t.eq(n.profile, bare);
  t.eq(extractProfile({ "a==>b": { ct: 1 } }).profile["a==>b"].ct, 1);
  t.throws(function(){ extractProfile({ a: 1 }); }, /No XHProf data/);
  /* a plain object must not be mistaken for a profile via its prototype */
  t.throws(function(){ extractProfile({ x: { toString: 1 } }); }, /No XHProf data/);
}],

["buildModel: inclusive, exclusive, roots, totals", function(t){
  var m = buildModel({
    "main()":     { ct: 1, wt: 100 },
    "main()==>a": { ct: 2, wt: 60 },
    "a==>b":      { ct: 4, wt: 25 }
  });
  t.eq(m.metricList.join(","), "wt");
  t.eq(m.roots.join(","), "main()");
  t.eq(m.funcs.get("main()").incl.wt, 100);
  t.eq(m.funcs.get("main()").excl.wt, 40);
  t.eq(m.funcs.get("a").incl.wt, 60);
  t.eq(m.funcs.get("a").excl.wt, 35);
  t.eq(m.funcs.get("b").excl.wt, 25);
  t.eq(m.funcs.get("b").ct, 4);
  t.eq(m.totals.wt, 100);
  t.eq(m.totalCt, 7);
  t.ok(m.rootSet.has("main()"));
}],

["buildModel: profile without a main() entry", function(t){
  var m = buildModel({ "top==>x": { ct: 1, wt: 10 }, "top==>y": { ct: 1, wt: 5 } });
  t.eq(m.roots.join(","), "top");
  t.eq(m.funcs.get("top").incl.wt, 15);   /* filled from its callees */
  t.eq(m.funcs.get("top").excl.wt, 0);
  t.eq(m.totals.wt, 15);
}],

["buildModel: metric discovery keeps unknown keys", function(t){
  var m = buildModel({ "main()": { ct: 1, wt: 10, cpu: 5, mu: 100, weird: 3 } });
  t.eq(m.metricList.join(","), "wt,cpu,mu,weird");
  t.eq(unitOf("wt"), "us");
  t.eq(unitOf("mu"), "bytes");
  t.eq(unitOf("weird"), "count");
  t.throws(function(){ buildModel({}); }, /no usable entries/);
}],

["formatters", function(t){
  t.eq(fmtUs(999), "999 µs");
  t.eq(fmtUs(1500), "1.50 ms");
  t.eq(fmtUs(2500000), "2.500 s");
  t.eq(fmtBytes(512), "512 B");
  t.eq(fmtBytes(2048), "2.0 KB");
  t.eq(fmtBytes(-1048576), "-1.00 MB");
  t.eq(fmtPct(1, 4), "25.00%");
  t.eq(fmtPct(1, 0), "0.00%");
  t.eq(esc('<a href="x">&'), "&lt;a href=&quot;x&quot;&gt;&amp;");
  t.eq(fmtDelta(-1500, "wt"), "−1.50 ms");
  t.eq(fmtRatio(Infinity), "new");
}],

["csv cells", function(t){
  t.eq(csvCell("a,b"), '"a,b"');
  t.eq(csvCell("say \"hi\""), "\"say \"\"hi\"\"\"");
  t.eq(csvCell("=cmd()"), "'=cmd()");        /* no formula injection */
  t.eq(csvCell("+1"), "'+1");
  t.eq(csvCell(-5), "-5");
  t.eq(csvCell("plain"), "plain");
}]
];

function runSelfTests(){
  var rows = [], pass = 0, fail = 0;
  SELF_TESTS.forEach(function(pair){
    var errs = [];
    var t = {
      eq: function(a, b){
        if (a !== b) errs.push("expected " + JSON.stringify(b) + ", got " + JSON.stringify(a));
      },
      ok: function(v){ if (!v) errs.push("expected a truthy value"); },
      throws: function(fn, re){
        try { fn(); errs.push("expected a throw matching " + re); }
        catch (e){ if (!re.test(e.message)) errs.push("threw \"" + e.message + '", expected ' + re); }
      }
    };
    try { pair[1](t); } catch (e){ errs.push("threw " + e.message); }
    if (errs.length) fail++; else pass++;
    rows.push({ ok: !errs.length, name: pair[0], why: errs.join(" · ") });
  });
  return { pass: pass, fail: fail, rows: rows };
}

function showSelfTests(){
  var r = runSelfTests();
  $("#dropErr").innerHTML = '<div class="st">' + r.rows.map(function(x){
    return "<div><span class=\"" + (x.ok ? "ok" : "ko") + '">' + (x.ok ? "PASS" : "FAIL")
      + "</span> " + esc(x.name) + (x.ok ? "" : " — " + esc(x.why)) + "</div>";
  }).join("") + '</div><div class="st-sum ' + (r.fail ? "ko" : "ok") + '">'
    + r.pass + " passed, " + r.fail + " failed</div>";
  return r;
}
