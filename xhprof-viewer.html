<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Nothing here talks to the network, and the CSP makes that verifiable by the
     browser rather than a promise in a README. blob: is only for the CSV download. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>XHProf Viewer</title>
<style>
:root{
  --bg:#0f1115; --bg2:#151922; --bg3:#1c2130; --line:#262d3d;
  --fg:#e6e9ef; --fg2:#9aa4b8; --fg3:#6b7488;
  --accent:#5aa9ff; --warn:#ffb454; --bad:#ff6b6b;
  --bar:#2b4a72; --bar2:#3a6ea5; --ok:#4ec9a0;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#fff; --bg3:#eef1f6; --line:#dde2ea;
  --fg:#161a22; --fg2:#5a6377; --fg3:#8b93a5;
  --accent:#0b6bcb; --bar:#cfe0f5; --bar2:#9dc2ea; --ok:#127a5e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--accent)}
.spacer{flex:1}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.file-name{font-family:var(--mono);font-size:12px;color:var(--fg2);max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=search]{background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:220px}

#drop{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#drop .card{border:2px dashed var(--line);border-radius:16px;padding:44px 52px;text-align:center;max-width:760px;background:var(--bg2)}
#drop.hot .card{border-color:var(--accent);background:var(--bg3)}
#drop h2{margin:0 0 6px;font-size:20px}
#drop p{color:var(--fg2);margin:6px 0}
#drop code{font-family:var(--mono);background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:12px}
.dz-actions{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
textarea{width:100%;min-height:110px;margin-top:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:12px;padding:8px;display:none}

#app{flex:1;display:none;flex-direction:column;min-height:0}
.summary{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;background:var(--bg2);border-bottom:1px solid var(--line)}
.kpi{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:118px}
.kpi .k{font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:17px;font-family:var(--mono);margin-top:2px}

.tabs{display:flex;gap:2px;padding:8px 16px 0;background:var(--bg2)}
.tab{background:none;border:1px solid transparent;border-bottom:none;padding:7px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--fg2)}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--fg);font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.hint{color:var(--fg3);font-size:12px}
.views{flex:1;min-height:0;overflow:auto}
.view{display:none;padding:0 0 40px}
.view.on{display:block}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);text-align:right;padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none;font-weight:600;z-index:2}
thead th:first-child{text-align:left}
thead th:hover{color:var(--accent)}
thead th .ar{color:var(--accent);font-size:10px}
tbody td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
tbody td:first-child{text-align:left;max-width:52ch;overflow:hidden;text-overflow:ellipsis}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg2)}
.pct{color:var(--fg2)}
.barcell{width:120px}
.bar{height:9px;background:var(--bar);border-radius:3px;position:relative;overflow:hidden;display:block}
.bar>i{position:absolute;top:0;bottom:0;left:0;background:var(--bar2);display:block}
.more{padding:14px 16px;text-align:center}

#tree{padding:8px 16px;font-family:var(--mono);font-size:12.5px}
.tn{display:flex;align-items:center;gap:8px;padding:2px 0}
.tn:hover{background:var(--bg2)}
.tw{width:82px;text-align:right}
.tp{width:58px;text-align:right;color:var(--fg2)}
.tc{width:62px;text-align:right;color:var(--fg3)}
.tg{width:90px}
.tk{background:none;border:none;cursor:pointer;color:var(--accent);width:16px;text-align:left;padding:0}
.tn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;cursor:pointer}
.tn.rec .nm{color:var(--warn)}
.tkids{margin-left:16px;border-left:1px dotted var(--line);padding-left:6px}

#flamewrap{padding:12px 16px}
#flame{position:relative;font-family:var(--mono);font-size:11px;user-select:none}
.fr{position:absolute;height:17px;border-radius:2px;overflow:hidden;white-space:nowrap;padding:0 4px;line-height:17px;cursor:pointer;color:#10131a;border:1px solid rgba(0,0,0,.25)}
.fr:hover{filter:brightness(1.18);outline:1px solid var(--fg)}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-family:var(--mono);font-size:12px}
.crumb button{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}

#panel{position:fixed;top:0;right:0;bottom:0;width:min(780px,94vw);background:var(--bg2);border-left:1px solid var(--line);box-shadow:-16px 0 40px rgba(0,0,0,.35);transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column;z-index:20}
#panel.on{transform:none}
#panel .ph{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
#panel .ph h3{margin:0;font-size:14px;font-family:var(--mono);word-break:break-all;flex:1}
#panel .pb{overflow:auto;padding:0 0 30px}
#panel h4{margin:18px 16px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:12px 16px 4px}
.mgrid div{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.mgrid .k{font-size:11px;color:var(--fg2)}
.mgrid .v{font-family:var(--mono);font-size:14px}
.empty{padding:8px 16px;color:var(--fg3);font-size:12px}
#raw{padding:12px 16px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--fg2)}
.err{margin:16px 0 0;padding:12px 14px;border:1px solid var(--bad);border-radius:8px;background:rgba(255,107,107,.08);color:var(--fg);font-family:var(--mono);font-size:12px;white-space:pre-wrap;text-align:left}
.ins{padding:16px;max-width:1040px}
.ins h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.ins h3:first-child{margin-top:4px}
.ins h3 .n{background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:0 7px;font-size:11px;letter-spacing:0;color:var(--fg2)}
.ins .desc{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.ins .desc p{margin:10px 0}
.ins .desc code,.ins .card code{font-family:var(--mono);font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:4px}
.ins .card{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--fg3);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.ins .card.hi{border-left-color:var(--bad)}
.ins .card.med{border-left-color:var(--warn)}
.ins .card.low{border-left-color:var(--accent)}
.ins .card .ct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ins .card .sev{font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--fg2);background:var(--bg3)}
.ins .card.hi .sev{color:var(--bad);border-color:var(--bad)}
.ins .card.med .sev{color:var(--warn);border-color:var(--warn)}
.ins .card.low .sev{color:var(--accent);border-color:var(--accent)}
.ins .card .ti{font-weight:600}
.ins .card .fn{background:none;border:none;padding:0;cursor:pointer;color:var(--accent);font-family:var(--mono);font-size:12.5px;text-align:left}
.ins .card .fn:hover{text-decoration:underline}
.ins .card .ev{font-family:var(--mono);font-size:11.5px;color:var(--fg2);margin-top:6px}
.ins .card ul{margin:8px 0 2px;padding-left:20px}
.ins .card li{margin:4px 0}
.ins .card p{margin:8px 0 0;color:var(--fg)}
.ins .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ins .chip{background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:2px 9px;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--fg2);max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins .chip:hover{border-color:var(--accent);color:var(--accent)}
.ins .foot{color:var(--fg3);font-size:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
input[type=search].bad{border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
thead th[aria-sort]{cursor:pointer}

/* header: baseline (diff) chip */
.chip-base{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:2px 4px 2px 10px;font-size:12px}
.chip-base .nm{font-family:var(--mono);max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-base button{background:none;border:none;color:var(--fg2);cursor:pointer;font-size:13px;padding:0 5px}
.chip-base button:hover{color:var(--bad)}

/* transient status: a bad second file must not destroy the loaded profile */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);max-width:min(680px,92vw);background:var(--bg2);border:1px solid var(--bad);border-left:4px solid var(--bad);border-radius:9px;padding:10px 14px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:transform .18s ease;z-index:40}
#toast.on{transform:translateX(-50%)}
#busy{position:fixed;top:0;left:0;right:0;padding:6px 16px;background:var(--accent);color:#fff;font-size:12px;text-align:center;z-index:50;display:none}
#busy.on{display:block}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:19}
#backdrop.on{opacity:1;pointer-events:auto}
#panel{visibility:hidden;transition:transform .18s ease,visibility 0s .18s}
#panel.on{visibility:visible;transition:transform .18s ease,visibility 0s}

/* diff view */
#diff .up{color:var(--bad)}
#diff .down{color:var(--ok)}
#diff .tag{font-size:10px;text-transform:uppercase;letter-spacing:.6px;border:1px solid var(--line);border-radius:20px;padding:1px 6px;color:var(--fg2);margin-left:6px}
#diff .tag.new{color:var(--warn);border-color:var(--warn)}
#diff .tag.gone{color:var(--fg3)}
.note{padding:14px 16px;color:var(--fg2);font-size:13px;max-width:900px}
.note code{font-family:var(--mono);background:var(--bg3);padding:1px 5px;border-radius:4px}

/* self-test report (?selftest=1) */
.st{text-align:left;font-family:var(--mono);font-size:12px;max-height:60vh;overflow:auto;margin-top:14px}
.st div{padding:2px 0;border-bottom:1px solid var(--line)}
.st .ok{color:var(--ok)}
.st .ko{color:var(--bad)}
.st-sum{margin-top:12px;font-family:var(--mono)}
</style>
</head>
<body>

<header>
  <h1>XHProf <span>Viewer</span></h1>
  <span class="file-name" id="fileName"></span>
  <span class="spacer"></span>
  <span class="chip-base" id="baseChip" hidden><span class="nm" id="baseName"></span><button id="baseClear" title="Drop the baseline" aria-label="Drop the baseline">&#10005;</button></span>
  <button class="btn" id="openBtn">Open file</button>
  <button class="btn" id="baseBtn" title="Load a second profile to diff against">Compare&hellip;</button>
  <input type="file" id="fileInput" hidden>
  <input type="file" id="baseInput" hidden>
  <button class="btn" id="themeBtn" title="Toggle theme (t)" aria-label="Toggle light/dark theme">&#9686;</button>
</header>

<div id="drop">
  <div class="card">
    <h2>Drop an XHProf profile here</h2>
    <p>Everything runs locally in this file &mdash; nothing is uploaded anywhere.</p>
    <p class="hint">Supported: PHP <code>serialize()</code> (<code>*.xhprof</code>), JSON (including XHGui documents),
       <code>&lt;?php return array(...)</code>, and <code>.gz</code> / raw zlib of any of those.</p>
    <div class="dz-actions">
      <button class="btn primary" id="pickBtn">Choose a file&hellip;</button>
      <button class="btn" id="pasteBtn">Paste raw data</button>
      <button class="btn" id="demoBtn">Load demo profile</button>
    </div>
    <textarea id="pasteArea" placeholder="Paste the raw profile content, then press Ctrl/Cmd+Enter"></textarea>
    <div id="dropErr"></div>
  </div>
</div>

<div id="app">
  <div class="summary" id="summary"></div>

  <div class="tabs" role="tablist" aria-label="Profile views">
    <button class="tab on" id="tab-flat" role="tab" aria-selected="true" aria-controls="view-flat" data-view="flat">Flat profile</button>
    <button class="tab" id="tab-tree" role="tab" aria-selected="false" aria-controls="view-tree" tabindex="-1" data-view="tree">Call tree</button>
    <button class="tab" id="tab-flame" role="tab" aria-selected="false" aria-controls="view-flame" tabindex="-1" data-view="flame">Flame graph</button>
    <button class="tab" id="tab-insight" role="tab" aria-selected="false" aria-controls="view-insight" tabindex="-1" data-view="insight">Insights</button>
    <button class="tab" id="tab-diff" role="tab" aria-selected="false" aria-controls="view-diff" tabindex="-1" data-view="diff" hidden>Diff</button>
    <button class="tab" id="tab-info" role="tab" aria-selected="false" aria-controls="view-info" tabindex="-1" data-view="info">Info</button>
  </div>

  <div class="toolbar">
    <label class="hint" for="q">Filter</label>
    <input type="search" id="q" placeholder="Filter functions&hellip; (regex ok, / to focus)" aria-describedby="counts">
    <label class="hint">Metric <select id="metric"></select></label>
    <label class="hint" id="rootWrap">Root <select id="root"></select></label>
    <span class="spacer"></span>
    <span class="hint" id="counts"></span>
    <button class="btn" id="csvBtn">Export CSV</button>
  </div>

  <div class="views">
    <div class="view on" id="view-flat" role="tabpanel" aria-labelledby="tab-flat" tabindex="0">
      <table id="flat"><thead></thead><tbody></tbody></table>
      <div class="more" id="more"></div>
    </div>
    <div class="view" id="view-tree" role="tabpanel" aria-labelledby="tab-tree" tabindex="0"><div id="tree" role="tree" aria-label="Call tree"></div></div>
    <div class="view" id="view-flame" role="tabpanel" aria-labelledby="tab-flame" tabindex="0"><div id="flamewrap"><div class="crumb" id="crumb"></div><div id="flame" role="group" aria-label="Flame graph"></div></div></div>
    <div class="view" id="view-insight" role="tabpanel" aria-labelledby="tab-insight" tabindex="0"><div id="insight"></div></div>
    <div class="view" id="view-diff" role="tabpanel" aria-labelledby="tab-diff" tabindex="0"><div id="diff"></div></div>
    <div class="view" id="view-info" role="tabpanel" aria-labelledby="tab-info" tabindex="0"><div id="raw"></div></div>
  </div>
</div>

<div id="backdrop"></div>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true">
  <div class="ph">
    <h3 id="pTitle"></h3>
    <button class="btn" id="pClose" aria-label="Close details">&#10005;</button>
  </div>
  <div class="pb" id="pBody"></div>
</div>

<div id="busy" role="status" aria-live="polite"></div>
<div id="toast" role="alert" aria-live="assertive"></div>

<script>
"use strict";

/* ================================================================== *
 * 1. Parsers: PHP serialize(), PHP array literal, JSON, gzip
 * ================================================================== */

/* `byteChars` says one JS char == one byte (latin-1 decoded payload), which is
   how we survive serialize() data carrying non-UTF-8 binary strings. */
function phpUnserialize(str, byteChars){
  var i = 0;
  function fail(m){ throw new Error("unserialize: " + m + " at offset " + i); }
  function eat(ch){ if (str[i] !== ch) fail('expected "' + ch + '" but got "' + (str[i] || "EOF") + '"'); i++; }
  function upto(ch){
    var j = str.indexOf(ch, i);
    if (j < 0) fail("unterminated token");
    var s = str.slice(i, j); i = j + 1; return s;
  }
  /* serialize() string lengths are BYTE counts: walk code points, count UTF-8 bytes. */
  function readBytes(len){
    if (byteChars){ var s1 = str.substr(i, len); i += len; return s1; }
    var start = i, bytes = 0;
    while (bytes < len && i < str.length){
      var cp = str.codePointAt(i);
      bytes += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
      i += cp > 0xFFFF ? 2 : 1;
    }
    return str.slice(start, i);
  }
  function value(){
    switch (str[i]){
      case "N": i += 2; return null;
      case "b": i += 2; return upto(";") === "1";
      case "i": i += 2; return parseInt(upto(";"), 10);
      case "d": {
        i += 2;
        var v = upto(";");
        if (v === "NAN") return NaN;
        if (v === "INF") return Infinity;
        if (v === "-INF") return -Infinity;
        return parseFloat(v);
      }
      case "s": {
        i += 2;
        var n = parseInt(upto(":"), 10);
        eat('"'); var s = readBytes(n); eat('"'); eat(";");
        return s;
      }
      case "a": {
        i += 2;
        var cnt = parseInt(upto(":"), 10);
        eat("{");
        var out = Object.create(null); /* a "__proto__" key must stay a key */
        for (var k = 0; k < cnt; k++){ var key = value(); out[key] = value(); }
        eat("}");
        return out;
      }
      case "O": { /* objects -> plain maps of their properties */
        i += 2;
        var nl = parseInt(upto(":"), 10);
        eat('"'); readBytes(nl); eat('"'); eat(":");
        var pc = parseInt(upto(":"), 10);
        eat("{");
        var obj = Object.create(null);
        for (var p = 0; p < pc; p++){
          var pk = String(value());
          pk = pk.replace(/^\x00[^\x00]*\x00/, ""); /* strip private/protected mangling */
          obj[pk] = value();
        }
        eat("}");
        return obj;
      }
      case "E": { /* enum: E:len:"Enum:CASE"; -> keep the case name */
        i += 2;
        var el = parseInt(upto(":"), 10);
        eat('"'); var es = readBytes(el); eat('"'); eat(";");
        return es;
      }
      case "r": case "R": fail("back-references (r:/R:) are not supported; re-dump the profile with serialize() of a plain array");
      case "C": fail("custom-serialized objects (C:) are not supported; this viewer only reads plain arrays/objects");
      default: fail('unknown type "' + (str[i] || "EOF") + '"');
    }
  }
  return value();
}

/* Tolerant parser for `<?php return array('a' => array('ct' => 1), ...);` */
function phpLiteralParse(src){
  var s = String(src).replace(/^\uFEFF/, "").trim();
  s = s.replace(/^<\?php\s*/i, "").replace(/^return\s+/i, "").replace(/;?\s*(\?>)?\s*$/, "");
  var i = 0;
  function fail(m){ throw new Error("php literal: " + m + " at offset " + i); }
  function ws(){ while (i < s.length && /[\s,]/.test(s[i])) i++; }
  function readString(){
    var q = s[i++], out = "";
    while (i < s.length){
      var c = s[i];
      if (c === "\\"){
        var n = s[i + 1];
        if (q === "'"){ out += (n === "'" || n === "\\") ? n : "\\" + n; i += 2; continue; }
        i += 2;
        out += n === "n" ? "\n" : n === "t" ? "\t" : n === "r" ? "\r" : n;
        continue;
      }
      if (c === q){ i++; return out; }
      out += c; i++;
    }
    fail("unterminated string");
  }
  function arr(close){
    var out = Object.create(null), auto = 0;
    for (;;){
      ws();
      if (s[i] === close){ i++; return out; }
      if (i >= s.length) fail("unterminated array");
      var first = value();
      ws();
      if (s[i] === "=" && s[i + 1] === ">"){ i += 2; out[first] = value(); }
      else out[auto++] = first;
    }
  }
  function value(){
    ws();
    var c = s[i];
    if (c === "'" || c === '"') return readString();
    if (c === "["){ i++; return arr("]"); }
    if (/^array\s*\(/i.test(s.slice(i, i + 12))){ i = s.indexOf("(", i) + 1; return arr(")"); }
    var m = /^(-?\d+\.?\d*(?:[eE][-+]?\d+)?|true|false|null)/i.exec(s.slice(i));
    if (!m) fail('unexpected "' + (c || "EOF") + '"');
    i += m[0].length;
    var t = m[0].toLowerCase();
    if (t === "true") return true;
    if (t === "false") return false;
    if (t === "null") return null;
    return parseFloat(m[0]);
  }
  return value();
}

async function inflate(buf, format){
  var stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream(format));
  return await new Response(stream).arrayBuffer();
}

/* gzip (1f 8b) and raw zlib (78 01/5e/9c/da), which is what several xhprof
   extensions and XHGui setups write. */
async function maybeDecompress(buf){
  var u8 = new Uint8Array(buf), fmts = null;
  if (u8.length < 2) return buf;
  if (u8[0] === 0x1f && u8[1] === 0x8b) fmts = ["gzip"];
  else if (u8[0] === 0x78 && [0x01, 0x5e, 0x9c, 0xda].indexOf(u8[1]) >= 0) fmts = ["deflate", "deflate-raw"];
  if (!fmts) return buf;
  if (typeof DecompressionStream !== "function")
    throw new Error("This file is compressed (" + fmts[0] + "), but this browser has no DecompressionStream.");
  var last = null;
  for (var k = 0; k < fmts.length; k++){
    try { return await inflate(buf, fmts[k]); } catch (e){ last = e; }
  }
  throw new Error("Could not decompress this file as " + fmts.join(" or ") + ": " + (last && last.message));
}

function parseProfileText(text, byteChars){
  var t = String(text).replace(/^\uFEFF/, "").trim();
  if (!t) throw new Error("Empty input.");
  var unser = function(s){ return phpUnserialize(s, byteChars); };
  if (/^[aOsibdN]:/.test(t)) return { data: unser(t), format: "PHP serialize()" };
  if (t[0] === "{" || t[0] === "[") {
    try { return { data: JSON.parse(t), format: "JSON" }; } catch (e){ /* maybe a PHP short-array literal */ }
  }
  if (/^(<\?php|return|array\s*\(|\[)/i.test(t)) return { data: phpLiteralParse(t), format: "PHP array literal" };
  var tries = [[unser, "PHP serialize()"], [JSON.parse, "JSON"], [phpLiteralParse, "PHP array literal"]];
  for (var k = 0; k < tries.length; k++){
    try { return { data: tries[k][0](t), format: tries[k][1] }; } catch (e){ /* next */ }
  }
  throw new Error("Unrecognised format: expected PHP serialize(), JSON or a PHP array literal.");
}

/* Locate the actual edge map inside whatever wrapper we were handed. */
function hasOwn(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }

function extractProfile(data){
  function looksLikeProfile(o){
    if (!o || typeof o !== "object") return false;
    var keys = Object.keys(o);
    if (!keys.length) return false;
    for (var n = 0; n < Math.min(keys.length, 80); n++){
      var k = keys[n], v = o[k];
      if (k.indexOf("==>") >= 0 || k === "main()") return true;
      /* own properties only: "constructor" in {} is true for any plain object */
      if (v && typeof v === "object" && (hasOwn(v, "wt") || hasOwn(v, "ct") || hasOwn(v, "cpu") || hasOwn(v, "samples"))) return true;
    }
    return false;
  }
  if (looksLikeProfile(data)) return { profile: data, meta: null };

  var wrappers = ["profile", "profiles", "prof", "data", "0"];
  for (var w = 0; w < wrappers.length; w++){
    var key = wrappers[w];
    if (data && typeof data === "object" && hasOwn(data, key) && looksLikeProfile(data[key])){
      var meta = {};
      Object.keys(data).forEach(function(k){ if (k !== key) meta[k] = data[k]; });
      return { profile: data[key], meta: Object.keys(meta).length ? meta : null };
    }
  }
  if (data && typeof data === "object"){
    var ks = Object.keys(data);
    for (var j = 0; j < ks.length; j++){
      var v = data[ks[j]];
      if (v && typeof v === "object"){
        if (looksLikeProfile(v)) return { profile: v, meta: { wrapper: ks[j] } };
        if (looksLikeProfile(v.profile)) return { profile: v.profile, meta: v.meta || { wrapper: ks[j] } };
      }
    }
  }
  throw new Error('No XHProf data found (expected entries keyed like "parent==>child").');
}

/* ================================================================== *
 * 2. Model: aggregate edges into per-function inclusive / exclusive
 * ================================================================== */

var METRIC_META = {
  ct:      { label: "Calls",       unit: "count" },
  wt:      { label: "Wall time",   unit: "us" },
  cpu:     { label: "CPU time",    unit: "us" },
  utime:   { label: "User time",   unit: "us" },
  stime:   { label: "System time", unit: "us" },
  mu:      { label: "Memory",      unit: "bytes" },
  pmu:     { label: "Peak memory", unit: "bytes" },
  samples: { label: "Samples",     unit: "count" }
};
var METRIC_ORDER = ["wt", "cpu", "utime", "stime", "mu", "pmu", "samples"];

function buildModel(profile){
  var found = Object.create(null), edges = [];
  Object.keys(profile).forEach(function(rawKey){
    var v = profile[rawKey];
    if (!v || typeof v !== "object") return;
    var key = String(rawKey);
    var sep = key.indexOf("==>");
    var parent = sep >= 0 ? key.slice(0, sep) : null;
    var child = sep >= 0 ? key.slice(sep + 3) : key;
    var m = Object.create(null);
    Object.keys(v).forEach(function(k){
      var n = typeof v[k] === "number" ? v[k] : parseFloat(v[k]);
      if (isFinite(n)){ m[k] = n; if (k !== "ct") found[k] = true; }
    });
    edges.push({ key: key, parent: parent, child: child, m: m, ct: m.ct || 0 });
  });
  if (!edges.length) throw new Error("Profile contains no usable entries.");

  var names = Object.keys(found);
  var metricList = METRIC_ORDER.filter(function(m){ return found[m]; })
    .concat(names.filter(function(m){ return METRIC_ORDER.indexOf(m) < 0; }));
  if (!metricList.length) metricList = ["ct"];

  var funcs = new Map();
  function get(name){
    var f = funcs.get(name);
    if (!f){
      f = { name: name, ct: 0, incl: Object.create(null), kids: Object.create(null),
            excl: Object.create(null), parents: [], children: [] };
      metricList.forEach(function(m){ f.incl[m] = 0; f.kids[m] = 0; f.excl[m] = 0; });
      funcs.set(name, f);
    }
    return f;
  }

  edges.forEach(function(e){
    var c = get(e.child);
    c.ct += e.ct;
    metricList.forEach(function(m){ c.incl[m] += e.m[m] || 0; });
    c.parents.push(e);
    if (e.parent !== null){
      var p = get(e.parent);
      metricList.forEach(function(m){ p.kids[m] += e.m[m] || 0; });
      p.children.push(e);
    }
  });
  /* A function that never appears as a callee has no inclusive row of its own
     (some profiles omit the "main()" entry). Its inclusive cost is then at
     least the sum of its callees, otherwise every total would come out zero. */
  funcs.forEach(function(f){
    if (!f.parents.length){
      metricList.forEach(function(m){ if (!f.incl[m]) f.incl[m] = f.kids[m]; });
      if (!f.ct) f.ct = 1;
    }
    metricList.forEach(function(m){ f.excl[m] = f.incl[m] - f.kids[m]; });
  });

  /* roots: main() first, then any function that is never called by anybody */
  var roots = [], rootSet = new Set();
  function addRoot(n){ if (!rootSet.has(n)){ rootSet.add(n); roots.push(n); } }
  if (funcs.has("main()")) addRoot("main()");
  funcs.forEach(function(f){
    if (f.parents.every(function(e){ return e.parent === null; })) addRoot(f.name);
  });
  if (!roots.length){
    var best = Array.from(funcs.values()).sort(function(a, b){ return (b.incl[metricList[0]] || 0) - (a.incl[metricList[0]] || 0); })[0];
    addRoot(best.name);
  }

  var totals = Object.create(null), totalCt = 0;
  metricList.forEach(function(m){
    var t = roots.reduce(function(s, r){ return s + (funcs.get(r).incl[m] || 0); }, 0);
    if (!t) funcs.forEach(function(f){ t += f.excl[m] || 0; });
    totals[m] = t;
  });
  funcs.forEach(function(f){ totalCt += f.ct; });

  return { funcs: funcs, edges: edges, metricList: metricList, roots: roots,
           rootSet: rootSet, totals: totals, totalCt: totalCt };
}

/* ================================================================== *
 * 3. Formatting helpers
 * ================================================================== */

function fmtInt(n){ return Math.round(n).toLocaleString("en-US"); }
function fmtUs(us){
  var a = Math.abs(us);
  if (a < 1000) return (Math.round(us * 10) / 10) + " µs";
  if (a < 1e6) return (us / 1000).toFixed(a < 1e4 ? 2 : 1) + " ms";
  return (us / 1e6).toFixed(3) + " s";
}
function fmtBytes(b){
  var sign = b < 0 ? "-" : "", a = Math.abs(b);
  if (a < 1024) return sign + a + " B";
  if (a < 1048576) return sign + (a / 1024).toFixed(1) + " KB";
  if (a < 1073741824) return sign + (a / 1048576).toFixed(2) + " MB";
  return sign + (a / 1073741824).toFixed(2) + " GB";
}
function unitOf(m){ return (METRIC_META[m] || {}).unit || "count"; }
function fmtMetric(v, m){
  var u = unitOf(m);
  return u === "us" ? fmtUs(v) : u === "bytes" ? fmtBytes(v) : fmtInt(v);
}
function label(m){ return (METRIC_META[m] || {}).label || m; }
function pct(v, t){ return t ? (100 * v / t) : 0; }
function fmtPct(v, t){ return pct(v, t).toFixed(2) + "%"; }
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;";
  });
}
function shortName(n){ return n.length > 70 ? n.slice(0, 34) + "…" + n.slice(-34) : n; }

/* ================================================================== *
 * 4. State + views
 * ================================================================== */

function $(s){ return document.querySelector(s); }

var M = null;                                    /* current profile      */
var B = null;                                    /* diff baseline or null */
var META = { file: "", format: "", meta: null };
var BMETA = null;
var metric = "wt";
var sortKey = "excl", sortDir = -1;
var rowLimit = 250;
var flameRoot = null, flamePath = [];
var activeView = "flat";
var filterBad = false;

function isFlameable(m){ var u = unitOf(m); return u === "us" || u === "count"; }

/* Views render on demand. Rebuilding the flame graph (up to 20k frames) and
   the insights for tabs nobody is looking at was by far the biggest cost. */
var VIEWS = ["flat", "tree", "flame", "insight", "diff", "info"];
var dirty = { flat: true, tree: true, flame: true, insight: true, diff: true, info: true };

function renderer(v){
  return { flat: renderFlat, tree: renderTree, flame: renderFlame,
           insight: renderInsight, diff: renderDiff, info: renderInfo }[v];
}
function invalidate(views){
  (views || VIEWS).forEach(function(v){ dirty[v] = true; });
  fCache = null;
  if (M) renderSummary();
  renderActive();
  updateCounts();
}
function renderActive(){
  if (!M || !dirty[activeView]) return;
  dirty[activeView] = false;
  renderer(activeView)();
}

/* ---------------- transient status ---------------- */

function busy(msg){
  var el = $("#busy");
  el.textContent = msg || "";
  el.classList.toggle("on", !!msg);
}

var toastTimer = null;
function toast(msg, good){
  var el = $("#toast");
  el.textContent = msg;
  el.style.borderColor = el.style.borderLeftColor = good ? "var(--ok)" : "var(--bad)";
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("on"); }, good ? 2600 : 8000);
}

/* Let the browser paint the "parsing" banner before we block the thread —
   but never wait on a frame that may never come (hidden tab, headless). */
function nextTick(){
  return new Promise(function(r){
    var done = false;
    var fin = function(){ if (!done){ done = true; r(); } };
    requestAnimationFrame(function(){ setTimeout(fin, 0); });
    setTimeout(fin, 50);
  });
}

/* ---------------- loading ---------------- */

async function loadFile(file, asBaseline){
  if (!file) return;
  busy("Reading " + file.name + "\u2026");
  try {
    var buf = await maybeDecompress(await file.arrayBuffer());
    var text = new TextDecoder("utf-8").decode(buf);
    var byteChars = false;
    /* Non-UTF-8 bytes inside a serialize() payload become U+FFFD and desync the
       byte-length walk: re-decode as latin-1, where one char is one byte. */
    if (text.indexOf("\uFFFD") >= 0 && /^[aOsibdN]:/.test(text.replace(/^\uFEFF/, "").replace(/^\s+/, ""))){
      text = new TextDecoder("latin1").decode(buf);
      byteChars = true;
    }
    await load(text, file.name, { byteChars: byteChars, baseline: asBaseline });
  } catch (e){ showError(e); }
  finally { busy(null); }
}

async function load(text, name, opts){
  opts = opts || {};
  busy((opts.baseline ? "Parsing baseline " : "Parsing ") + (name || "profile") + "\u2026");
  await nextTick();
  try {
    var parsed = parseProfileText(text, opts.byteChars);
    var found = extractProfile(parsed.data);
    var model = buildModel(found.profile);
    var meta = { file: name || "(pasted data)", format: parsed.format, meta: found.meta };

    if (opts.baseline){
      B = model; BMETA = meta;
      $("#baseName").textContent = meta.file;
      $("#baseChip").hidden = false;
      $("#tab-diff").hidden = false;
      invalidate(["diff", "info"]);
      toast("Baseline loaded: " + meta.file + " \u2014 see the Diff tab.", true);
      return;
    }

    M = model; META = meta;
    metric = M.metricList.indexOf("wt") >= 0 ? "wt" : M.metricList[0];
    sortKey = "excl"; sortDir = -1; rowLimit = 250;
    flameRoot = null; flamePath = [];
    boot();
  } catch (e){ showError(e); }
  finally { busy(null); }
}

function clearBaseline(){
  B = null; BMETA = null;
  $("#baseChip").hidden = true;
  $("#tab-diff").hidden = true;
  if (activeView === "diff") selectTab("flat");
  invalidate(["diff", "info"]);
}

function showError(e){
  var msg = e && e.message ? e.message : String(e);
  if (console && console.error) console.error(e);
  /* A bad second file must not throw away the profile already on screen. */
  if (M){ toast(msg); return; }
  $("#dropErr").innerHTML = '<div class="err">' + esc(msg) + "</div>";
  $("#drop").style.display = "flex";
  $("#app").style.display = "none";
}

function boot(){
  $("#dropErr").innerHTML = "";
  $("#drop").style.display = "none";
  $("#app").style.display = "flex";
  $("#fileName").textContent = META.file;

  $("#metric").innerHTML = M.metricList.map(function(m){
    return '<option value="' + esc(m) + '">' + esc(label(m)) + "</option>";
  }).join("");

  $("#root").innerHTML = M.roots.map(function(r){
    return '<option value="' + esc(r) + '">' + esc(shortName(r)) + "</option>";
  }).join("");
  $("#rootWrap").style.display = M.roots.length > 1 ? "" : "none";

  applyHash();                 /* view / metric / sort / filter / root from the URL */
  $("#metric").value = metric;

  invalidate();                /* also (re)draws the KPI strip */
  writeHash();
}

/* ---------------- summary ---------------- */

function renderSummary(){
  var kpis = [["Functions", fmtInt(M.funcs.size)], ["Call edges", fmtInt(M.edges.length)], ["Total calls", fmtInt(M.totalCt)]];
  M.metricList.forEach(function(m){
    var v = M.totals[m];
    var name = "Total " + label(m).toLowerCase();
    if (m === "pmu"){
      v = 0;
      M.funcs.forEach(function(f){ v = Math.max(v, f.incl[m] || 0); });
      name = "Max peak memory";
    }
    kpis.push([name, fmtMetric(v, m)]);
  });
  if (B && B.metricList.indexOf(metric) >= 0)
    kpis.push(["\u0394 total " + label(metric).toLowerCase() + " vs baseline",
               fmtDelta((M.totals[metric] || 0) - (B.totals[metric] || 0), metric)]);
  $("#summary").innerHTML = kpis.map(function(kv){
    return '<div class="kpi"><div class="k">' + esc(kv[0]) + '</div><div class="v">' + esc(kv[1]) + "</div></div>";
  }).join("");
}

/* ---------------- flat profile ---------------- */

/* Each column owns its sort key (the "%" columns used to share theirs with the
   value column, so clicking one flipped the other's direction). */
var SORT_FIELD = { name: "name", ct: "ct", ctPct: "ct", incl: "incl",
                   inclPct: "incl", excl: "excl", exclPct: "excl" };

var fCache = null, fCacheKey = "";

function filteredFuncs(){
  var q = $("#q").value.trim();
  var key = [q, sortKey, sortDir, metric].join("\u0000");
  if (fCache && fCacheKey === key) return fCache;

  var list = Array.from(M.funcs.values());
  filterBad = false;
  if (q){
    var re = null;
    try { re = new RegExp(q, "i"); }
    catch (e){ re = null; filterBad = true; }   /* half-typed pattern: say so */
    var lower = q.toLowerCase();
    list = list.filter(function(f){ return re ? re.test(f.name) : f.name.toLowerCase().indexOf(lower) >= 0; });
  }
  var field = SORT_FIELD[sortKey] || "excl";
  function val(f){
    if (field === "name") return f.name;
    if (field === "ct") return f.ct;
    return f[field] ? f[field][metric] : 0;
  }
  list.sort(function(a, b){
    var x = val(a), y = val(b);
    if (typeof x === "string") return sortDir * x.localeCompare(y);
    return sortDir * (x - y);
  });
  fCacheKey = key; fCache = list;
  return list;
}

function updateCounts(list, shownCount){
  if (!M) return;
  if (!list) list = filteredFuncs();
  if (shownCount === undefined) shownCount = Math.min(rowLimit, list.length);
  $("#q").classList.toggle("bad", filterBad);
  $("#counts").textContent = (filterBad ? "invalid regex \u2014 matching as plain text \u00b7 " : "")
    + shownCount + " / " + list.length + " functions";
}

var COLS = [
  { sk: "name",    k: "name", t: "Function" },
  { sk: "ct",      k: "ct",   t: "Calls" },
  { sk: "ctPct",   k: "ct",   t: "Calls %" },
  { sk: "incl",    k: "incl", t: "Incl" },
  { sk: "inclPct", k: "incl", t: "Incl %" },
  { sk: "excl",    k: "excl", t: "Excl" },
  { sk: "exclPct", k: "excl", t: "Excl %" },
  { t: "" }
];

function renderFlat(){
  $("#flat thead").innerHTML = "<tr>" + COLS.map(function(c){
    var t = (c.t === "Incl" || c.t === "Excl") ? c.t + " " + label(metric) : c.t;
    var on = c.sk === sortKey;
    var attrs = c.sk ? ' data-k="' + c.sk + '" tabindex="0" role="button" aria-sort="'
      + (on ? (sortDir < 0 ? "descending" : "ascending") : "none") + '"' : "";
    return "<th" + attrs + ">" + esc(t)
      + (on ? ' <span class="ar" aria-hidden="true">' + (sortDir < 0 ? "▼" : "▲") + "</span>" : "") + "</th>";
  }).join("") + "</tr>";

  var list = filteredFuncs();
  var total = M.totals[metric] || 1;
  var shown = list.slice(0, rowLimit);
  /* Scale the bars against the whole filtered set, so "Show more" does not
     re-calibrate the rows already on screen. */
  var maxExcl = 1;
  list.forEach(function(f){ maxExcl = Math.max(maxExcl, Math.abs(f.excl[metric])); });

  $("#flat tbody").innerHTML = shown.map(function(f){
    var w = Math.min(100, Math.abs(f.excl[metric]) / maxExcl * 100);
    return '<tr data-f="' + esc(f.name) + '">'
      + '<td title="' + esc(f.name) + '">' + esc(shortName(f.name)) + "</td>"
      + "<td>" + fmtInt(f.ct) + "</td>"
      + '<td class="pct">' + fmtPct(f.ct, M.totalCt) + "</td>"
      + "<td>" + esc(fmtMetric(f.incl[metric], metric)) + "</td>"
      + '<td class="pct">' + fmtPct(f.incl[metric], total) + "</td>"
      + "<td>" + esc(fmtMetric(f.excl[metric], metric)) + "</td>"
      + '<td class="pct">' + fmtPct(f.excl[metric], total) + "</td>"
      + '<td class="barcell"><span class="bar"><i style="width:' + w.toFixed(2) + '%"></i></span></td>'
      + "</tr>";
  }).join("");

  updateCounts(list, shown.length);
  $("#more").innerHTML = list.length > rowLimit
    ? '<button class="btn" id="moreBtn">Show ' + Math.min(500, list.length - rowLimit) + " more…</button>"
    : "";
}

/* ---------------- function detail panel ---------------- */

function openFunc(name){
  var f = M.funcs.get(name);
  if (!f) return;
  $("#pTitle").textContent = name;
  var total = M.totals[metric] || 1;

  var html = '<div class="mgrid"><div><div class="k">Calls</div><div class="v">' + fmtInt(f.ct) + "</div></div>";
  M.metricList.forEach(function(m){
    var t = M.totals[m] || 1;
    html += '<div><div class="k">Incl ' + esc(label(m)) + '</div><div class="v">' + esc(fmtMetric(f.incl[m], m))
          + '</div><div class="k">' + fmtPct(f.incl[m], t) + " of run</div></div>";
    html += '<div><div class="k">Excl ' + esc(label(m)) + '</div><div class="v">' + esc(fmtMetric(f.excl[m], m))
          + '</div><div class="k">' + fmtPct(f.excl[m], t) + " of run</div></div>";
    if (f.ct) html += '<div><div class="k">Per call &middot; ' + esc(label(m)) + '</div><div class="v">'
          + esc(fmtMetric(f.incl[m] / f.ct, m)) + "</div></div>";
  });
  html += "</div>";

  function edgeTable(list, side){
    if (!list.length) return '<div class="empty">none</div>';
    var rows = list.slice().sort(function(a, b){ return (b.m[metric] || 0) - (a.m[metric] || 0); }).map(function(e){
      var other = side === "parents" ? (e.parent === null ? "(entry point)" : e.parent) : e.child;
      var clickable = !(side === "parents" && e.parent === null);
      return "<tr" + (clickable ? ' data-f="' + esc(other) + '"' : ' style="cursor:default"') + ">"
        + '<td title="' + esc(other) + '">' + esc(shortName(other)) + "</td>"
        + "<td>" + fmtInt(e.ct) + "</td>"
        + "<td>" + esc(fmtMetric(e.m[metric] || 0, metric)) + "</td>"
        + '<td class="pct">' + fmtPct(e.m[metric] || 0, f.incl[metric] || 1) + "</td>"
        + '<td class="pct">' + fmtPct(e.m[metric] || 0, total) + "</td></tr>";
    }).join("");
    return "<table><thead><tr><th>" + (side === "parents" ? "Caller" : "Callee")
      + "</th><th>Calls</th><th>" + esc(label(metric)) + "</th><th>% of fn</th><th>% of run</th></tr></thead><tbody>"
      + rows + "</tbody></table>";
  }

  html += "<h4>Called by (" + f.parents.length + ")</h4>" + edgeTable(f.parents, "parents");
  html += "<h4>Calls (" + f.children.length + ")</h4>" + edgeTable(f.children, "children");

  var body = $("#pBody");
  body.innerHTML = html;
  body.scrollTop = 0;
  openPanel();
}

/* ---------------- detail panel: dialog mechanics ---------------- */

var panelReturn = null;

function openPanel(){
  var p = $("#panel");
  if (!p.classList.contains("on")) panelReturn = document.activeElement;
  p.classList.add("on");
  p.setAttribute("aria-hidden", "false");
  $("#backdrop").classList.add("on");
  $("#pClose").focus();
}

function closePanel(){
  var p = $("#panel");
  if (!p.classList.contains("on")) return;
  p.classList.remove("on");
  p.setAttribute("aria-hidden", "true");
  $("#backdrop").classList.remove("on");
  if (panelReturn && panelReturn.focus) panelReturn.focus();
  panelReturn = null;
}

function panelOpen(){ return $("#panel").classList.contains("on"); }

/* ---------------- call tree (aggregated, edge-weighted) ---------------- */

function childEdgesScaled(name, value){
  var f = M.funcs.get(name);
  if (!f) return [];
  var inclF = f.incl[metric] || 0;
  var factor = inclF > 0 ? value / inclF : 0;
  return f.children.map(function(e){
    return { name: e.child, value: Math.max(0, (e.m[metric] || 0) * factor), ct: e.ct };
  }).filter(function(c){ return c.value > 0 || c.ct > 0; })
    .sort(function(a, b){ return b.value - a.value; });
}

function renderTree(){
  var root = $("#root").value || M.roots[0];
  var f = M.funcs.get(root);
  var box = $("#tree");
  box.innerHTML = "";
  box.appendChild(treeNode(root, f ? Math.max(0, f.incl[metric] || 0) : 0, f ? f.ct : 0,
                           new Set([root]), M.totals[metric] || 1, true));
}

function treeRow(name, value, ct, total, kidsCount, open, recursive){
  var row = document.createElement("div");
  row.className = "tn" + (recursive ? " rec" : "");
  var w = Math.max(0, Math.min(100, pct(value, total)));
  row.innerHTML =
      '<button class="tk">' + (recursive ? "↻" : kidsCount ? (open ? "▾" : "▸") : "·") + "</button>"
    + '<span class="tw">' + esc(fmtMetric(value, metric)) + "</span>"
    + '<span class="tp">' + w.toFixed(2) + "%</span>"
    + '<span class="tc">' + fmtInt(ct) + " ×</span>"
    + '<span class="tg">' + (recursive ? "" : '<span class="bar"><i style="width:' + w.toFixed(2) + '%"></i></span>') + "</span>"
    + '<span class="nm" title="' + esc(name) + '">' + esc(shortName(name)) + (recursive ? " (recursive)" : "") + "</span>";
  row.dataset.f = name;
  row.setAttribute("role", "treeitem");
  if (kidsCount && !recursive) row.setAttribute("aria-expanded", open ? "true" : "false");
  return row;                       /* name clicks are delegated on #tree */
}

function treeNode(name, value, ct, path, total, open){
  var wrap = document.createElement("div");
  var f = M.funcs.get(name);
  var kidsCount = f ? f.children.length : 0;

  var row = treeRow(name, value, ct, total, kidsCount, open, false);
  wrap.appendChild(row);

  var kids = document.createElement("div");
  kids.className = "tkids";
  kids.style.display = open ? "" : "none";
  wrap.appendChild(kids);

  var built = false;
  function build(){
    if (built) return;
    built = true;
    childEdgesScaled(name, value).forEach(function(c){
      if (path.has(c.name)){
        kids.appendChild(treeRow(c.name, c.value, c.ct, total, 0, false, true));
        return;
      }
      var p = new Set(path);
      p.add(c.name);
      kids.appendChild(treeNode(c.name, c.value, c.ct, p, total, false));
    });
    if (!kids.children.length) kids.innerHTML = '<div class="empty">no callees</div>';
  }
  if (open) build();

  var toggle = row.querySelector(".tk");
  toggle.setAttribute("aria-label", "Expand or collapse " + name);
  toggle.onclick = function(){        /* keeps its own closure over build() */
    if (!kidsCount) return;
    build();
    var visible = kids.style.display !== "none";
    kids.style.display = visible ? "none" : "";
    toggle.textContent = visible ? "▸" : "▾";
    row.setAttribute("aria-expanded", visible ? "false" : "true");
  };
  return wrap;
}

/* ---------------- flame graph ---------------- */

var ROW_H = 18, MAX_DEPTH = 48, MAX_FRAMES = 20000;

function buildFlame(rootName){
  var f = M.funcs.get(rootName);
  var rootVal = f ? Math.max(0, f.incl[metric] || 0) : 0;
  var min = rootVal * 0.0008;
  var count = 0;
  function node(name, value, ct, path, depth, rec){
    var n = { name: name, value: value, ct: ct, depth: depth, rec: !!rec, children: [] };
    if (rec || depth >= MAX_DEPTH || count > MAX_FRAMES) return n;
    childEdgesScaled(name, value).forEach(function(c){
      if (c.value <= min) return;
      count++;
      if (path.has(c.name)){ n.children.push(node(c.name, c.value, c.ct, path, depth + 1, true)); return; }
      path.add(c.name);
      n.children.push(node(c.name, c.value, c.ct, path, depth + 1, false));
      path.delete(c.name);
    });
    return n;
  }
  return node(rootName, rootVal, f ? f.ct : 0, new Set([rootName]), 0, false);
}

function hueOf(name){
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return h;
}

var flameCur = null, flameCrumbs = [];

function renderFlame(){
  var rootName = flameCur = flameRoot || $("#root").value || M.roots[0];
  var flame = $("#flame");
  if (!isFlameable(metric)){
    $("#crumb").innerHTML = "";
    flame.style.height = "auto";
    flame.innerHTML = '<div class="empty">The flame graph only makes sense for time or count metrics '
      + "(memory deltas can be negative). Switch the metric to wall time, CPU or calls.</div>";
    return;
  }

  var tree = buildFlame(rootName);
  var total = tree.value || 1;
  var out = [], maxDepth = 0;

  (function layout(n, x0, w){
    maxDepth = Math.max(maxDepth, n.depth);
    if (w > 0.04){
      out.push('<div class="fr" data-f="' + esc(n.name) + '" title="' + esc(n.name) + "\n"
        + esc(fmtMetric(n.value, metric)) + " · " + pct(n.value, total).toFixed(2) + "% · "
        + fmtInt(n.ct) + " calls" + (n.rec ? " · recursion cut off" : "") + '"'
        + ' style="left:' + x0.toFixed(4) + "%;width:" + w.toFixed(4) + "%;top:" + (n.depth * ROW_H)
        + "px;background:hsl(" + hueOf(n.name) + "," + (n.rec ? "20%,62%" : "62%,64%") + ')">'
        + (w > 1.2 ? esc(n.name) : "") + "</div>");
    }
    var cx = x0;
    n.children.forEach(function(c){
      var cw = n.value > 0 ? (c.value / n.value) * w : 0;
      layout(c, cx, cw);
      cx += cw;
    });
  })(tree, 0, 100);

  /* One delegated listener on #flame instead of up to MAX_FRAMES closures. */
  flame.innerHTML = out.join("");
  flame.style.height = ((maxDepth + 1) * ROW_H + 4) + "px";

  flameCrumbs = flamePath.concat([rootName]);
  $("#crumb").innerHTML = '<button data-i="-1">⌂ reset</button>'
    + flameCrumbs.map(function(c, i){ return '<button data-i="' + i + '">' + esc(shortName(c)) + "</button>"; }).join(" › ")
    + ' <span class="hint">click a frame to zoom &middot; alt/⌘-click for details</span>';
}

/* ---------------- insights: description, blockers, suggestions ---------------- */

/* The metric the analysis reasons about: wall time if we have it, else the
   closest thing to "cost" the profile carries. */
function analysisMetric(){
  var pref = ["wt", "cpu", "samples", "utime"];
  for (var i = 0; i < pref.length; i++) if (M.metricList.indexOf(pref[i]) >= 0) return pref[i];
  return M.metricList[0];
}

var SEV_ORDER = ["hi", "med", "low"];
function bySev(a, b){ return SEV_ORDER.indexOf(a.sev) - SEV_ORDER.indexOf(b.sev) || b.score - a.score; }

/* name -> pattern rules. Each fires on the functions it matches, once. */
var SUGGESTION_RULES = [
  { id: "db",
    re: /^(PDO|PDOStatement|mysqli|mysqli_stmt|Doctrine\\|Illuminate\\Database)|::(query|exec|execute|fetchAll|fetchAssoc)$|^(mysql_query|mysqli_query|mysqli_real_query|pg_query|pg_query_params|sqlsrv_query|oci_execute)$/i,
    title: "Database round-trips dominate a visible share of the run",
    fix: "Batch the queries (one IN(...) instead of a query per row), add the missing index, or cache the result set. Check whether the same statement is prepared repeatedly instead of once." },
  { id: "orm",
    re: /Repository|Hydrator|::(find|findBy|findAll|findOne|findOneBy|hydrate)[A-Za-z]*$|Doctrine\\ORM/i,
    title: "Repository/ORM accessors are called a lot",
    fix: "Fetch the whole collection in one call and index it in memory, or eager-load the relation (JOIN / WITH) instead of resolving it per entity.",
    minCt: 200 },
  { id: "autoload",
    re: /Autoload|autoload|spl_autoload_call|class_exists|interface_exists/i,
    title: "Class autoloading is expensive",
    fix: "Dump an authoritative classmap (composer dump-autoload -a -o) and enable opcache with opcache.preload for the hot classes." },
  { id: "include",
    re: /^(include|include_once|require|require_once|load::)/i,
    title: "File inclusion costs real time",
    fix: "Enable opcache (opcache.validate_timestamps=0 in production) so files are not re-parsed on every request." },
  { id: "http",
    re: /^(curl_exec|curl_multi_exec|file_get_contents|fsockopen|stream_socket_client|socket_connect)$|Guzzle|HttpClient|::request$/i,
    title: "Outbound calls block the request",
    fix: "Cache the responses, shorten the timeouts, run independent calls concurrently (curl_multi), or move the work to a queue." },
  { id: "fs",
    re: /^(file_exists|is_file|is_dir|is_readable|stat|lstat|filemtime|realpath|glob|scandir|opendir|readdir|fopen|fread|fwrite|unlink|touch)$/i,
    title: "High volume of filesystem stat/read calls",
    fix: "Cache the lookups in memory, raise realpath_cache_size, and avoid file_exists() checks on paths you are about to open anyway." },
  { id: "serialize",
    re: /^(json_encode|json_decode|serialize|unserialize|igbinary_serialize|igbinary_unserialize|var_export|msgpack_pack|msgpack_unpack)$/i,
    title: "Serialization is a hot path",
    fix: "Shrink the payload, keep the decoded structure around instead of re-decoding, or move to a cheaper codec (igbinary / msgpack)." },
  { id: "regex",
    re: /^(preg_match|preg_match_all|preg_replace|preg_replace_callback|preg_split|preg_quote)$/i,
    title: "Heavy regular-expression usage",
    fix: "Hoist the patterns out of the loop, replace simple patterns with str_contains/strtr/explode, and beware catastrophic backtracking in nested quantifiers." },
  { id: "linear_search",
    re: /^(in_array|array_search|array_keys|array_unique|array_diff|array_intersect|array_merge)$/i,
    title: "Linear array operations called very often",
    fix: "This is usually an accidental O(n²): flip the haystack into an associative array and use isset(), and build arrays with $a[] = ... / spread instead of array_merge in a loop." },
  { id: "sort",
    re: /^(usort|uasort|uksort|array_multisort)$/i,
    title: "Userland sorting with a PHP comparator",
    fix: "The callback is invoked O(n log n) times. Sort by a precomputed key (array_multisort / array_column) or let the database do the ordering.",
    minCt: 500 },
  { id: "template",
    re: /Twig|Smarty|Blade|Latte|::render$|::renderBlock$/i,
    title: "Template rendering is a significant slice",
    fix: "Make sure compiled templates are cached on disk (and not recompiled per request), and cache the expensive fragments." },
  { id: "reflection",
    re: /^Reflection|::newInstanceArgs$|::getAttributes$|::invokeArgs$/i,
    title: "Reflection used at runtime",
    fix: "Cache the reflection results (metadata, annotations, container wiring) or compile them at build time — most frameworks offer a compiled container for this." },
  { id: "log",
    re: /Monolog|^error_log$|^syslog$|::log$|Logger::/i,
    title: "Logging is on the hot path",
    fix: "Raise the log level in production, buffer the writes, and keep debug-level formatting behind a level check so the message is never built." },
  { id: "crypt",
    re: /^(password_hash|password_verify|crypt|hash_pbkdf2|openssl_|sodium_)/i,
    title: "Cryptographic work in the request",
    fix: "That cost is by design for password hashing — just make sure it happens once per request, and tune the cost factor deliberately." },
  { id: "sleep",
    re: /^(sleep|usleep|time_nanosleep)$/i,
    title: "The code sleeps during the request",
    fix: "Remove the sleep or move the polling to a background worker — it blocks the response for nothing.",
    minCt: 1, minPct: 0 },
  { id: "event",
    re: /Dispatcher|EventDispatcher|::dispatch$|::notify$|::trigger$/i,
    title: "Event dispatching overhead",
    fix: "Trim the listeners registered on the hot events and avoid instantiating listeners that end up doing nothing." },
  { id: "gc",
    re: /^gc_collect_cycles$/i,
    title: "Explicit garbage collection",
    fix: "Cycle collection is expensive; drop the manual call unless you measured that it helps.",
    minCt: 1, minPct: 0 }
];

function buildInsights(){
  var am = analysisMetric();
  var funcsAll = Array.from(M.funcs.values());
  /* Percentages are relative to the whole run. The root's inclusive value is the
     right total, except when it is missing or inconsistent (partial or merged
     profiles, count-only metrics) — then fall back to the sum of self values. */
  var sumPos = 0, maxSelf = 0;
  funcsAll.forEach(function(f){
    var v = f.excl[am] || 0;
    if (v > 0) sumPos += v;
    maxSelf = Math.max(maxSelf, v);
  });
  var total = am === "ct" ? (M.totalCt || 0) : (M.totals[am] || 0);
  if (!(total > 0) || total < maxSelf) total = Math.max(sumPos, maxSelf) || 1;
  var hasCpu = M.metricList.indexOf("cpu") >= 0 && M.metricList.indexOf("wt") >= 0;
  var cpuRatio = hasCpu ? 100 * (M.totals.cpu || 0) / (M.totals.wt || 1) : 0;
  var funcs = funcsAll;
  var pctOf = function(v){ return 100 * v / total; };
  /* Exclusive values can be negative (memory deltas, or call counts which do not
     telescope); clamp them when we reason about shares. */
  var selfOf = function(f){ return Math.max(0, f.excl[am] || 0); };
  var sumPosOf = function(m){
    var t = 0;
    funcsAll.forEach(function(f){ if ((f.excl[m] || 0) > 0) t += f.excl[m]; });
    return Math.max(M.totals[m] || 0, t);
  };

  /* ---- quick description ---- */
  var desc = [];
  var bySelf = funcs.slice().sort(function(a, b){ return selfOf(b) - selfOf(a); });
  var top5Pct = bySelf.slice(0, 5).reduce(function(s, f){ return s + pctOf(selfOf(f)); }, 0);

  desc.push("The run covers <b>" + fmtInt(M.funcs.size) + " functions</b> over <b>" + fmtInt(M.totalCt)
    + " calls</b>" + (am === "ct" ? "" : ", for a total " + esc(label(am)).toLowerCase()
    + " of <b>" + esc(fmtMetric(total, am)) + "</b>")
    + " (entry point <code>" + esc(shortName(M.roots[0])) + "</code>)."
    + (am === "ct" ? " This profile carries no time or memory metric, so the analysis below ranks by call volume only." : ""));

  var need80 = 0, acc = 0;
  for (var i = 0; i < bySelf.length && acc < 80; i++){ acc += pctOf(selfOf(bySelf[i])); need80++; }
  desc.push("Cost is " + (need80 <= 10 ? "<b>concentrated</b>" : need80 <= 40 ? "<b>moderately spread</b>" : "<b>very spread out</b>")
    + ": <b>" + need80 + "</b>" + (need80 > 1 ? " functions account" : " function accounts") + " for 80% of the self "
    + esc(label(am)).toLowerCase() + ", and the top five alone for " + top5Pct.toFixed(1) + "%"
    + (need80 > 40 ? " — expect death-by-a-thousand-cuts rather than one fixable hotspot." : "."));

  if (hasCpu){
    if (cpuRatio < 55) desc.push("Only <b>" + cpuRatio.toFixed(0) + "%</b> of the wall time is CPU: the request is <b>I/O bound</b> — most of it is spent waiting on the database, the network or the filesystem.");
    else if (cpuRatio > 85) desc.push("<b>" + cpuRatio.toFixed(0) + "%</b> of the wall time is CPU: the request is <b>CPU bound</b>, so look for algorithmic work rather than waits.");
    else desc.push("<b>" + cpuRatio.toFixed(0) + "%</b> of the wall time is CPU — a mix of computation and waiting.");
  }

  if (M.metricList.indexOf("mu") >= 0){
    var peak = 0;
    funcs.forEach(function(f){ peak = Math.max(peak, f.incl.pmu || 0); });
    desc.push("Memory: <b>" + esc(fmtBytes(sumPosOf("mu"))) + "</b> allocated"
      + (peak ? ", peak <b>" + esc(fmtBytes(peak)) + "</b>" : "") + ".");
  }

  var avgCall = M.totalCt ? total / M.totalCt : 0;
  if (M.totalCt > 200000)
    desc.push("<b>" + fmtInt(M.totalCt) + " calls</b> at " + esc(fmtMetric(avgCall, am))
      + " each: at this volume the PHP call overhead itself is part of the bill.");

  /* ---- blocking points ---- */
  var blockersBy = Object.create(null);
  function blocker(f, sev, reason){
    var b = blockersBy[f.name];
    if (!b) b = blockersBy[f.name] = { fn: f, sev: sev, reasons: [], score: 0 };
    if (SEV_ORDER.indexOf(sev) < SEV_ORDER.indexOf(b.sev)) b.sev = sev;
    b.reasons.push(reason);
    b.score = Math.max(b.score, pctOf(f.excl[am]), pctOf(f.incl[am]) / 2);
  }

  var isRoot = function(f){ return M.rootSet.has(f.name); };

  bySelf.forEach(function(f){
    var p = pctOf(f.excl[am]);
    if (p < 4 || isRoot(f)) return;
    blocker(f, p >= 20 ? "hi" : p >= 9 ? "med" : "low",
      "Burns <b>" + esc(fmtMetric(f.excl[am], am)) + "</b> of self " + esc(label(am)).toLowerCase()
      + " (<b>" + p.toFixed(1) + "%</b> of the run) across " + fmtInt(f.ct) + " call" + (f.ct > 1 ? "s" : "")
      + (f.ct > 1 ? ", " + esc(fmtMetric(f.excl[am] / f.ct, am)) + " each" : "") + ".");
  });

  if (hasCpu){
    funcs.forEach(function(f){
      var wait = (f.excl.wt || 0) - (f.excl.cpu || 0);
      var p = 100 * wait / (M.totals.wt || 1);
      if (p < 8) return;
      blocker(f, p >= 25 ? "hi" : "med",
        "Spends <b>" + esc(fmtUs(wait)) + "</b> (<b>" + p.toFixed(1) + "%</b> of the run) <b>off-CPU</b> — this is a wait, "
        + "not computation: I/O, a lock, or a remote service.");
    });
  }

  funcs.forEach(function(f){
    if (!f.ct) return;
    var per = f.incl[am] / f.ct;
    var p = pctOf(f.incl[am]);
    var trunk = p >= 50 || (pctOf(f.excl[am]) < 3 && f.children.length);
    if (unitOf(am) === "us" && per >= 100000 && p >= 8 && !trunk && !isRoot(f))
      blocker(f, p >= 25 ? "hi" : "med",
        "Each call costs <b>" + esc(fmtMetric(per, am)) + "</b> inclusive (" + fmtInt(f.ct) + " call"
        + (f.ct > 1 ? "s" : "") + ", " + p.toFixed(1) + "% of the run) — a single slow operation, not a volume problem.");
    if (f.ct >= 5000 && pctOf(f.excl[am]) >= 2 && !isRoot(f))
      blocker(f, "med", "Called <b>" + fmtInt(f.ct) + " times</b> for " + esc(fmtMetric(f.excl[am], am))
        + " of self time — the call volume is the problem, not the function.");
  });

  /* fan-out: one caller invoking the same callee hundreds of times (N+1 shape) */
  M.edges.forEach(function(e){
    if (!e.parent || e.ct < 50) return;
    var cost = e.m[am] || 0;
    if (pctOf(cost) < 5) return;
    var f = M.funcs.get(e.child);
    if (!f) return;
    blocker(f, pctOf(cost) >= 15 ? "hi" : "med",
      "<code>" + esc(shortName(e.parent)) + "</code> calls it <b>" + fmtInt(e.ct)
      + " times</b> for " + esc(fmtMetric(cost, am)) + " (" + pctOf(cost).toFixed(1)
      + "% of the run) — a loop calling out per iteration.");
  });

  var recursive = M.edges.filter(function(e){ return e.parent === e.child && e.ct > 0; })
    .sort(function(a, b){ return (b.m[am] || 0) - (a.m[am] || 0); });
  recursive.forEach(function(e){
    var f = M.funcs.get(e.child);
    if (!f || pctOf(e.m[am] || 0) < 5) return;
    blocker(f, "med", "Directly recursive: <b>" + fmtInt(e.ct) + "</b> self-calls for "
      + esc(fmtMetric(e.m[am] || 0, am)) + " — check the depth and memoize repeated sub-results.");
  });

  if (M.metricList.indexOf("mu") >= 0){
    funcs.slice().sort(function(a, b){ return (b.excl.mu || 0) - (a.excl.mu || 0); }).slice(0, 3).forEach(function(f){
      var p = 100 * (f.excl.mu || 0) / (M.totals.mu || 1);
      if (p < 20) return;
      blocker(f, "med", "Allocates <b>" + esc(fmtBytes(f.excl.mu)) + "</b> on its own (<b>" + p.toFixed(1)
        + "%</b> of everything allocated) — a good candidate for streaming/generators instead of building the whole set in memory.");
    });
  }

  var blockers = Object.keys(blockersBy).map(function(k){ return blockersBy[k]; })
    .sort(bySev).slice(0, 12);

  /* ---- suggestions ---- */
  var sugg = [];
  SUGGESTION_RULES.forEach(function(r){
    var hit = funcs.filter(function(f){ return r.re.test(f.name); });
    if (!hit.length) return;
    var selfCost = hit.reduce(function(s, f){ return s + f.excl[am]; }, 0);
    var inclCost = hit.reduce(function(s, f){ return s + f.incl[am]; }, 0);
    var calls = hit.reduce(function(s, f){ return s + f.ct; }, 0);
    var p = pctOf(selfCost), pIncl = pctOf(inclCost);
    var minPct = r.minPct === undefined ? 3 : r.minPct;
    var minCt = r.minCt === undefined ? 2000 : r.minCt;
    if (p < minPct && calls < minCt) return;
    hit.sort(function(a, b){ return b.excl[am] - a.excl[am]; });
    sugg.push({
      sev: p >= 15 ? "hi" : p >= 5 ? "med" : "low",
      score: p,
      title: r.title,
      evidence: fmtInt(calls) + " call" + (calls > 1 ? "s" : "") + " · " + fmtMetric(selfCost, am)
        + " self (" + p.toFixed(1) + "%)" + (pIncl > p + 1 ? " · " + fmtMetric(inclCost, am) + " inclusive (" + pIncl.toFixed(1) + "%)" : ""),
      fix: r.fix,
      fns: hit.slice(0, 6).map(function(f){ return f.name; })
    });
  });

  /* structural suggestions that do not depend on function names */
  if (need80 > 40)
    sugg.push({ sev: "med", score: 4, title: "No single hotspot — the cost is structural",
      evidence: need80 + " functions needed to reach 80% of self " + label(am).toLowerCase(),
      fix: "Micro-optimising one function will not move the needle. Look one level up: cut the number of objects/rows processed, cache the whole operation, or skip the work entirely for this code path.", fns: [] });
  if (M.totalCt > 500000)
    sugg.push({ sev: "med", score: 6, title: "Very high call volume", evidence: fmtInt(M.totalCt) + " calls in one run",
      fix: "Reduce the amount of data flowing through the loop (fewer rows, fewer objects) rather than the cost per call — and make sure profiling overhead is not inflating what you read here.", fns: [] });
  if (hasCpu && cpuRatio < 55)
    sugg.push({ sev: "hi", score: 30, title: "The request mostly waits", evidence: cpuRatio.toFixed(0) + "% of wall time is CPU",
      fix: "Start with the off-CPU blockers below/above: query count and latency, external HTTP calls, filesystem access. Faster PHP code will barely help here.", fns: [] });
  if (M.roots.length > 3)
    sugg.push({ sev: "low", score: 1, title: M.roots.length + " entry points in this profile",
      evidence: "roots: " + M.roots.slice(0, 4).map(shortName).join(", ") + (M.roots.length > 4 ? ", …" : ""),
      fix: "Several call graphs are merged here (aggregated runs, or a profiler started late). Percentages are relative to their sum — pick a root in the toolbar to read one graph at a time.", fns: [] });

  sugg.sort(bySev);

  return { desc: desc, blockers: blockers, sugg: sugg, am: am };
}

function renderInsight(){
  var box = $("#insight");
  var r;
  try { r = buildInsights(); }
  catch (e){ box.innerHTML = '<div class="empty">Could not analyse this profile: ' + esc(e.message) + "</div>"; return; }

  var SEV = { hi: "critical", med: "worth a look", low: "minor" };
  function chips(names){
    if (!names.length) return "";
    return '<div class="chips">' + names.map(function(n){
      return '<button class="chip" data-f="' + esc(n) + '" title="' + esc(n) + '">' + esc(shortName(n)) + "</button>";
    }).join("") + "</div>";
  }

  var html = '<div class="ins">';

  html += '<h3>What this profile says</h3><div class="desc">'
    + r.desc.map(function(d){ return "<p>" + d + "</p>"; }).join("") + "</div>";

  html += "<h3>Blocking points <span class=\"n\">" + r.blockers.length + "</span></h3>";
  html += r.blockers.length
    ? r.blockers.map(function(b){
        return '<div class="card ' + b.sev + '">'
          + '<div class="ct"><span class="sev">' + SEV[b.sev] + '</span>'
          + '<button class="fn" data-f="' + esc(b.fn.name) + '">' + esc(shortName(b.fn.name)) + "</button></div>"
          + "<ul>" + b.reasons.map(function(x){ return "<li>" + x + "</li>"; }).join("") + "</ul></div>";
      }).join("")
    : '<div class="empty">Nothing stands out: no function takes a disproportionate share of the run.</div>';

  html += "<h3>Suggestions <span class=\"n\">" + r.sugg.length + "</span></h3>";
  html += r.sugg.length
    ? r.sugg.map(function(s){
        return '<div class="card ' + s.sev + '">'
          + '<div class="ct"><span class="sev">' + SEV[s.sev] + '</span><span class="ti">' + esc(s.title) + "</span></div>"
          + '<div class="ev">' + esc(s.evidence) + "</div>"
          + "<p>" + esc(s.fix) + "</p>" + chips(s.fns) + "</div>";
      }).join("")
    : '<div class="empty">No known pattern matched. Read the flat profile sorted by self time.</div>';

  html += '<p class="foot">Heuristics, not verdicts: they are name- and share-based, computed on '
    + esc(label(r.am).toLowerCase()) + '. Confirm each one in the flat profile or the call tree before changing code.</p>';
  html += "</div>";

  box.innerHTML = html;             /* clicks are delegated on #insight */
}

/* ---------------- diff against a baseline ---------------- */

var dSortKey = "dExcl", dSortDir = -1;

var DIFF_COLS = [
  { dk: "name",  t: "Function" },
  { dk: "dCt",   t: "Δ calls" },
  { dk: "dIncl", t: "Δ incl" },
  { dk: "dExcl", t: "Δ excl" },
  { dk: "rExcl", t: "Δ excl %" },
  { dk: "excl",  t: "Excl now" }
];

function fmtDelta(v, m){
  var s = v > 0 ? "+" : v < 0 ? "−" : "";
  return s + fmtMetric(Math.abs(v), m);
}
function fmtDeltaInt(v){
  return (v > 0 ? "+" : v < 0 ? "−" : "") + fmtInt(Math.abs(v));
}
function fmtRatio(r){
  if (r === Infinity) return "new";
  if (r === -Infinity) return "gone";
  return (r > 0 ? "+" : "") + r.toFixed(1) + "%";
}
function sortable(v){ return isFinite(v) ? v : (v > 0 ? 1e18 : -1e18); }

/* Union of both profiles, deltas on the active metric. The toolbar filter
   applies here too, so the diff can be narrowed the same way. */
function diffRows(){
  var q = $("#q").value.trim(), re = null;
  if (q){ try { re = new RegExp(q, "i"); } catch (e){ re = null; } }
  var lower = q.toLowerCase();

  var names = new Set();
  M.funcs.forEach(function(f){ names.add(f.name); });
  B.funcs.forEach(function(f){ names.add(f.name); });

  var rows = [];
  names.forEach(function(n){
    if (q && !(re ? re.test(n) : n.toLowerCase().indexOf(lower) >= 0)) return;
    var a = M.funcs.get(n), b = B.funcs.get(n);
    var eA = a ? (a.excl[metric] || 0) : 0, eB = b ? (b.excl[metric] || 0) : 0;
    var iA = a ? (a.incl[metric] || 0) : 0, iB = b ? (b.incl[metric] || 0) : 0;
    rows.push({
      name: n, cur: !!a, base: !!b,
      excl: eA, dExcl: eA - eB, dIncl: iA - iB,
      dCt: (a ? a.ct : 0) - (b ? b.ct : 0),
      rExcl: eB ? 100 * (eA - eB) / Math.abs(eB) : (eA ? Infinity : 0)
    });
  });

  rows.sort(function(x, y){
    if (dSortKey === "name") return dSortDir * x.name.localeCompare(y.name);
    return dSortDir * (sortable(x[dSortKey]) - sortable(y[dSortKey]));
  });
  return rows;
}

function renderDiff(){
  var box = $("#diff");
  if (!B){
    box.innerHTML = '<div class="note">No baseline loaded. Hit <b>Compare…</b> in the header '
      + "(or shift-drop a file, or press <code>c</code>) to load a second profile, and this tab "
      + "shows what moved between the two — per function, on the active metric.</div>";
    return;
  }
  if (B.metricList.indexOf(metric) < 0){
    box.innerHTML = '<div class="note">The baseline <code>' + esc(BMETA.file) + "</code> carries no <code>"
      + esc(metric) + "</code> metric (it has " + esc(B.metricList.join(", "))
      + "). Pick a metric both profiles share.</div>";
    return;
  }

  var rows = diffRows();
  var tA = M.totals[metric] || 0, tB = B.totals[metric] || 0;
  var dT = tA - tB;
  var worse = rows.filter(function(r){ return r.dExcl > 0; }).length;
  var better = rows.filter(function(r){ return r.dExcl < 0; }).length;

  var head = '<div class="note"><b>' + esc(META.file) + "</b> vs baseline <b>" + esc(BMETA.file) + "</b>"
    + " · total " + esc(label(metric).toLowerCase()) + " " + esc(fmtMetric(tB, metric))
    + " → " + esc(fmtMetric(tA, metric))
    + ' <span class="' + (dT > 0 ? "up" : "down") + '">(' + esc(fmtDelta(dT, metric))
    + (tB ? ", " + fmtRatio(100 * dT / Math.abs(tB)) : "") + ")</span>"
    + " · " + fmtInt(worse) + " functions slower, " + fmtInt(better) + " faster"
    + ", calls " + esc(fmtDeltaInt(M.totalCt - B.totalCt)) + ".</div>";

  var shown = rows.slice(0, rowLimit);
  var thead = "<tr>" + DIFF_COLS.map(function(c){
    var t = c.t === "Δ incl" ? "Δ incl " + label(metric)
          : c.t === "Δ excl" ? "Δ excl " + label(metric)
          : c.t === "Excl now" ? "Excl " + label(metric) + " now" : c.t;
    var on = c.dk === dSortKey;
    return '<th data-dk="' + c.dk + '" tabindex="0" role="button" aria-sort="'
      + (on ? (dSortDir < 0 ? "descending" : "ascending") : "none") + '">' + esc(t)
      + (on ? ' <span class="ar" aria-hidden="true">' + (dSortDir < 0 ? "▼" : "▲") + "</span>" : "")
      + "</th>";
  }).join("") + "</tr>";

  var body = shown.map(function(r){
    var cls = r.dExcl > 0 ? "up" : r.dExcl < 0 ? "down" : "";
    var tag = !r.base ? '<span class="tag new">new</span>'
            : !r.cur ? '<span class="tag gone">gone</span>' : "";
    return "<tr" + (r.cur ? ' data-f="' + esc(r.name) + '"' : ' style="cursor:default"') + ">"
      + '<td title="' + esc(r.name) + '">' + esc(shortName(r.name)) + tag + "</td>"
      + "<td>" + esc(fmtDeltaInt(r.dCt)) + "</td>"
      + "<td>" + esc(fmtDelta(r.dIncl, metric)) + "</td>"
      + '<td class="' + cls + '">' + esc(fmtDelta(r.dExcl, metric)) + "</td>"
      + '<td class="pct ' + cls + '">' + esc(fmtRatio(r.rExcl)) + "</td>"
      + "<td>" + esc(fmtMetric(r.excl, metric)) + "</td></tr>";
  }).join("");

  box.innerHTML = head + "<table><thead>" + thead + "</thead><tbody>" + body + "</tbody></table>"
    + (rows.length > shown.length
        ? '<div class="more">' + fmtInt(rows.length - shown.length)
          + " more rows — narrow the filter, or use Export CSV for the whole diff.</div>"
        : "");
}

function exportDiffCsv(){
  var rows = [["function", "in_current", "in_baseline", "calls_delta",
               "incl_" + metric + "_delta", "excl_" + metric + "_delta",
               "excl_" + metric + "_now", "excl_pct_change"]];
  diffRows().forEach(function(r){
    rows.push([r.name, r.cur ? 1 : 0, r.base ? 1 : 0, r.dCt, r.dIncl, r.dExcl, r.excl,
               isFinite(r.rExcl) ? r.rExcl.toFixed(2) : ""]);
  });
  download(fileStem() + "-vs-" + (BMETA.file || "baseline").replace(/\.[^.]*$/, "") + "-" + metric + "-diff.csv",
           csvText(rows));
}

    + "· An XHProf profile is aggregated per caller→callee edge, not a timeline. The call tree and\n"
    + "  flame graph therefore distribute each edge's cost proportionally to the caller's share, and\n"
    + "  recursion is cut off where a function reappears in its own stack (marked ↻ / greyed out).\n"
    + "· mu/pmu are memory deltas and can be negative; they are excluded from the flame graph.\n"
    + "· The Insights tab describes the run, ranks the blocking points and matches known slow patterns.\n"
    + "  Those are heuristics computed from names and cost shares — verify them here before acting on them.");
  $("#raw").textContent = lines.join("\n");
}

/* ---------------- CSV export ---------------- */

function csvCell(c){
  var s = String(c);
  /* Only text can start like a formula; negative numbers are left alone. */
  if (/^[=+@\t\r]/.test(s)) s = "'" + s;
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvText(rows){
  return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n");
}

function download(name, text){
  var a = document.createElement("a");
  /* BOM: without it Excel mangles non-ASCII function names */
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + text], { type: "text/csv;charset=utf-8" }));
  a.download = name;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}

function fileStem(){ return (META.file || "profile").replace(/\.[^.]*$/, ""); }

function exportCsv(){
  if (activeView === "diff" && B) return exportDiffCsv();
  var total = M.totals[metric] || 1;
  var rows = [["function", "calls", "calls_pct", "incl_" + metric, "incl_pct", "excl_" + metric, "excl_pct"]];
  filteredFuncs().forEach(function(f){
    rows.push([f.name, f.ct, pct(f.ct, M.totalCt).toFixed(4),
               f.incl[metric], pct(f.incl[metric], total).toFixed(4),
               f.excl[metric], pct(f.excl[metric], total).toFixed(4)]);
  });
  download(fileStem() + "-" + metric + ".csv", csvText(rows));
}

var hashTimer = null;

function writeHash(){
  if (!M) return;
  clearTimeout(hashTimer);
  hashTimer = setTimeout(function(){
    var p = new URLSearchParams();
    p.set("v", activeView);
    p.set("m", metric);
    p.set("s", sortKey);
    p.set("d", sortDir < 0 ? "desc" : "asc");
    var q = $("#q").value.trim();
    if (q) p.set("q", q);
    var r = $("#root").value;
    if (r && r !== M.roots[0]) p.set("r", r);
    /* file:// browsers may refuse replaceState; the app just keeps working. */
    try { history.replaceState(null, "", "#" + p.toString()); } catch (e){}
  }, 200);
}

function applyHash(){
  var h = location.hash.replace(/^#/, "");
  if (!h) return;
  var p = new URLSearchParams(h);
  var m = p.get("m");
  if (m && M.metricList.indexOf(m) >= 0) metric = m;
  var s = p.get("s");
  if (s && SORT_FIELD[s]) sortKey = s;
  if (p.get("d")) sortDir = p.get("d") === "asc" ? 1 : -1;
  var q = p.get("q");
  if (q) $("#q").value = q;
  var r = p.get("r");
  if (r && M.roots.indexOf(r) >= 0) $("#root").value = r;
  var v = p.get("v");
  if (v && VIEWS.indexOf(v) >= 0 && (v !== "diff" || B)) selectTab(v, true);
}

/* ---------------- tabs ---------------- */

function selectTab(name, silent){
  if (VIEWS.indexOf(name) < 0) return;
  activeView = name;
  document.querySelectorAll(".tab").forEach(function(t){
    var on = t.dataset.view === name;
    t.classList.toggle("on", on);
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("on", v.id === "view-" + name); });
  renderActive();
  if (!silent) writeHash();
}

function visibleTabs(){
  return Array.prototype.filter.call(document.querySelectorAll(".tab"), function(t){ return !t.hidden; });
}

document.querySelector(".tabs").addEventListener("click", function(e){
  var t = e.target.closest(".tab");
  if (t) selectTab(t.dataset.view);
});

document.querySelector(".tabs").addEventListener("keydown", function(e){
  var tabs = visibleTabs();
  var i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  var j = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1
        : e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : -1;
  if (j < 0) return;
  e.preventDefault();
  j = (j + tabs.length) % tabs.length;
  selectTab(tabs[j].dataset.view);
  tabs[j].focus();
});

  var t = e.target;

    if (tabs[n - 1]) selectTab(tabs[n - 1].dataset.view);
  }
